name: Hourly YouTube Shorts Generator & Uploader (24x Daily)

on:
  schedule:
    # Runs every hour at minute 18 (off-peak to avoid GitHub top-of-hour :00 delays)
    - cron: '25 * * * *'
      timezone: 'Asia/Kolkata'

  workflow_dispatch:
    inputs:
      category:
        description: 'Specific category/niche (leave blank for random rotation)'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'Run in Mock / Dry-Run mode (no API credits used)'
        required: false
        default: false
        type: boolean
      upload:
        description: 'Upload directly to YouTube'
        required: false
        default: true
        type: boolean
      privacy:
        description: 'YouTube privacy status'
        required: false
        default: 'public'
        type: choice
        options:
          - public
          - unlisted
          - private


jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Schedule Test
        run: echo "SCHEDULE TRIGGERED"
        
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Shorts Automator Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || inputs.privacy || 'public' }}
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=""
          
          # Handle manual workflow dispatch overrides
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.category }}" ]; then
              ARGS="$ARGS --category \"${{ inputs.category }}\""
            fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            else
              ARGS="$ARGS --live"
            fi
            if [ "${{ inputs.upload }}" = "false" ]; then
              ARGS="$ARGS --no-upload"
            fi
            if [ -n "${{ inputs.privacy }}" ]; then
              ARGS="$ARGS --privacy \"${{ inputs.privacy }}\""
            else
              ARGS="$ARGS --privacy \"public\""
            fi

          else
            # Scheduled run defaults to live generation and public upload
            ARGS="--live --privacy \"public\""
          fi

          echo "Running: python cli.py run-once $ARGS"
          eval python cli.py run-once $ARGS

      - name: Upload Generated Videos as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts-${{ github.run_id }}
          path: |
            output/final/*.mp4
            output/audio/*.mp3
            output/images/*.jpg
          retention-days: 7

